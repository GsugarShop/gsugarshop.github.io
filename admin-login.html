<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gsugar Admin Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-portal">
  <div class="page-shell">
    <main>
      <section class="section">
        <div class="section-intro">
          <span class="section-label">Admin portal</span>
          <h2>Secure company access</h2>
          <p>Enter the access code to review and update customer orders.</p>
        </div>

        <div class="card-grid">
          <article class="admin-card">
            <form id="adminLoginForm" action="/admin/login" method="post">
              <label>Access code<span> *</span>
                <input type="password" name="password" placeholder="Enter admin code" required />
              </label>
              <button class="btn btn-primary" type="submit">Open portal</button>
            </form>
            <p id="loginError" class="error-message hidden">Invalid access code. Please try again.</p>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === '1') {
      document.getElementById('loginError').classList.remove('hidden');
    }
  </script>
</body>
</html>
