<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gsugar Company Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-portal">
  <div class="page-shell">
    <main>
      <section class="section">
        <div class="section-intro">
          <span class="section-label">Admin portal</span>
          <h2>Secure company access</h2>
          <p>This page is not linked from the public site. Enter the access code to review and update customer orders.</p>
          <button class="btn btn-outline hidden" id="adminLogoutBtn">Logout</button>
        </div>

        <div class="card-grid" id="adminLoginSection">
          <article class="admin-card">
            <form id="adminLoginForm">
              <label>Access code<span> *</span>
                <input type="password" id="adminAccessCode" placeholder="Enter admin code" required />
              </label>
              <button class="btn btn-primary" type="submit">Open portal</button>
            </form>
          </article>
        </div>
      </section>

      <section id="adminOrdersSection" class="section hidden">
        <div class="section-intro">
          <span class="section-label">Orders</span>
          <h2>Manage customer requests</h2>
          <p>Update statuses and contact buyers after checkout.</p>
        </div>

        <div class="admin-settings">
          <label>Pickup date / time<span> *</span>
            <input type="text" id="pickupSlot" required />
          </label>
          <label>Location<span> *</span>
            <input type="text" id="pickupLocation" required />
          </label>
          <button id="savePickupSettings" class="btn btn-primary" type="button">Save pickup details</button>
        </div>

        <div class="admin-orders" id="adminOrdersList">
          <p class="empty-note">Log in to load the latest active orders.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
